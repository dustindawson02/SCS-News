name: SCS Discord News

on:
  workflow_dispatch:

  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

jobs:
  check-scs-news:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install feedparser requests

      - name: Check SCS blog
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scs_news.py

      - name: Save latest article
        run: |
          git config user.name "SCS Newsletter"
          git config user.email "actions@users.noreply.github.com"
          git add last_scs_post.json
          git diff --cached --quiet || git commit -m "Update latest SCS article"
          git push
